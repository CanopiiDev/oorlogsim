# ============================================================
#  OorlogSim — berichten (MiniMessage-opmaak: <red>, <bold>, <#ff0000>, ...)
#  {prefix} wordt overal vervangen door 'prefix'.
# ============================================================
prefix: "<dark_gray>[<gold>OS</gold>]</dark_gray> "

general:
  no-permission: "{prefix}<red>Daar heb je geen permissie voor."
  players-only: "{prefix}<red>Alleen spelers kunnen dit doen."
  reloaded: "{prefix}<green>Config en berichten herladen."
  unknown-command: "{prefix}<red>Onbekend commando. Gebruik <yellow>/os help</yellow>."
  world-missing: "{prefix}<red>Wereld <yellow>{world}</yellow> bestaat niet (check config.yml)."
  not-set: "{prefix}<red>{what} is nog niet ingesteld."

help:
  - "<gold><bold>OorlogSim</bold></gold>"
  - "<yellow>/os lobby</yellow> <gray>- naar de OS-lobby"
  - "<yellow>/os kitpvp</yellow> <gray>- naar KitPvP"
  - "<yellow>/os stats [speler]</yellow> <gray>- all-time stats"
help-admin:
  - "<gold>Admin:</gold>"
  - "<yellow>/os admin maps</yellow> <gray>- overzicht van alle maps"
  - "<yellow>/os admin map create|delete|enable|disable|rename</yellow>"
  - "<yellow>/os admin setspawn <map> <KD1|KD2></yellow>"
  - "<yellow>/os admin tp <map> <KD1|KD2></yellow>"
  - "<yellow>/os admin setlobby</yellow> / <yellow>setbutton</yellow>"
  - "<yellow>/os admin setkit <os|kitpvp></yellow> / <yellow>givekit</yellow>"
  - "<yellow>/os admin kitpvp addspawn|clearspawns|spawns</yellow>"
  - "<yellow>/os admin setleaderboard <type> [id]</yellow> / <yellow>removeleaderboard <id></yellow> / <yellow>leaderboards</yellow>"
  - "<yellow>/os admin start|stop|reload</yellow>"

admin:
  map-created: "{prefix}<green>Map <yellow>{map}</yellow> aangemaakt."
  map-exists: "{prefix}<red>Map <yellow>{map}</yellow> bestaat al."
  map-deleted: "{prefix}<green>Map <yellow>{map}</yellow> verwijderd."
  map-unknown: "{prefix}<red>Map <yellow>{map}</yellow> bestaat niet."
  map-enabled: "{prefix}<green>Map <yellow>{map}</yellow> staat aan."
  map-disabled: "{prefix}<yellow>Map <yellow>{map}</yellow> staat uit."
  map-renamed: "{prefix}<green>Weergavenaam van <yellow>{map}</yellow> is nu <yellow>{name}</yellow>."
  map-wrong-world: "{prefix}<red>Je moet in de maps-wereld <yellow>{world}</yellow> staan."
  spawn-set: "{prefix}<green>Spawn van {team} <green>op map <yellow>{map}</yellow> gezet."
  team-unknown: "{prefix}<red>Gebruik KD1 of KD2."
  lobby-set: "{prefix}<green>Lobby-spawn gezet."
  lobby-wrong-world: "{prefix}<red>Je moet in de lobby-wereld <yellow>{world}</yellow> staan."
  button-set: "{prefix}<green>Startknop gezet op <yellow>{x} {y} {z}</yellow>."
  button-not-a-button: "{prefix}<red>Kijk naar een knop (max. 6 blokken ver)."
  kit-set: "{prefix}<green>Kit <yellow>{kit}</yellow> opgeslagen uit je inventory."
  kit-given: "{prefix}<green>Kit <yellow>{kit}</yellow> in je inventory gezet."
  kit-unknown: "{prefix}<red>Gebruik os of kitpvp."
  kitpvp-spawn-added: "{prefix}<green>KitPvP-spawn #{n} toegevoegd."
  kitpvp-spawns-cleared: "{prefix}<green>Alle KitPvP-spawns verwijderd."
  kitpvp-spawns-header: "{prefix}<gold>KitPvP-spawns ({n}):"
  kitpvp-spawn-line: "<gray>#{n}: <white>{x} {y} {z}"
  kitpvp-wrong-world: "{prefix}<red>Je moet in de KitPvP-wereld <yellow>{world}</yellow> staan."
  leaderboard-set: "{prefix}<green>Leaderboard <yellow>{id}</yellow> ({type}) geplaatst."
  leaderboard-removed: "{prefix}<green>Leaderboard <yellow>{id}</yellow> verwijderd."
  leaderboard-unknown: "{prefix}<red>Leaderboard <yellow>{id}</yellow> bestaat niet."
  leaderboard-type-unknown: "{prefix}<red>Onbekend type. Kies uit: <yellow>{types}</yellow>"
  leaderboards-header: "{prefix}<gold>Leaderboards:"
  leaderboards-line: "<gray>- <yellow>{id}</yellow> <white>{type}</white> <gray>({world} {x} {y} {z})"
  started: "{prefix}<green>Countdown geforceerd."
  stopped: "{prefix}<yellow>OS gestopt."
  nothing-to-stop: "{prefix}<red>Er loopt geen OS of countdown."
  overview-title: "<dark_gray>OS Maps"
  overview-ready: "<green>Klaar"
  overview-missing: "<red>Spawn mist"
  overview-lore:
    - "<gray>KD1 ({team1}): {kd1}"
    - "<gray>KD2 ({team2}): {kd2}"
    - "<gray>Status: {enabled}"
    - ""
    - "<yellow>Linksklik</yellow><gray>: tp naar KD1"
    - "<yellow>Rechtsklik</yellow><gray>: tp naar KD2"
    - "<yellow>Shift-klik</yellow><gray>: aan/uit"
  overview-on: "<green>aan"
  overview-off: "<red>uit"
  overview-check: "<green>✔"
  overview-cross: "<red>✘"
  teleported: "{prefix}<green>Geteleporteerd."

lobby:
  welcome: "{prefix}<gray>Welkom in de OS-lobby! Kies een team met de blokken in je hotbar."
  joined-team: "{prefix}<gray>Je zit nu in {team}<gray>."
  already-in-team: "{prefix}<gray>Je zit al in {team}<gray>."
  item-name: "{team} <gray>(rechtsklik om te joinen)"
  vote-item-name: "<yellow>Stem op een map <gray>(rechtsklik)"
  vote-title: "<dark_gray>Stem op een map"
  vote-lore: "<gray>Stemmen: <yellow>{votes}"
  voted: "{prefix}<gray>Je stemt op <yellow>{map}</yellow>."
  no-maps: "{prefix}<red>Er zijn nog geen maps klaar (beide spawns gezet)."
  match-running: "{prefix}<red>Er loopt al een oorlog. Wacht op de volgende!"
  not-enough-players: "{prefix}<red>Er zijn minimaal {min} spelers nodig om te starten."
  countdown-started: "{prefix}<yellow>{player}</yellow> <gray>heeft de oorlog gestart! Begint over <yellow>{seconds}</yellow> seconden."
  countdown: "{prefix}<gray>De oorlog begint over <yellow>{seconds}</yellow> seconden."
  countdown-title: "<gold>{seconds}"
  countdown-cancelled: "{prefix}<red>Countdown afgebroken: niet genoeg spelers per team."
  countdown-already: "{prefix}<gray>De countdown loopt al."

match:
  started: "{prefix}<gold><bold>De oorlog is begonnen!</bold></gold> <gray>Map: <yellow>{map}"
  start-title: "<gold><bold>OORLOG!"
  start-subtitle: "{team1} <gray>vs {team2}"
  killed-by: "{prefix}{victim} <gray>is gedood door {killer}<gray>."
  died: "{prefix}{victim} <gray>is gestorven."
  left: "{prefix}{victim} <gray>heeft de oorlog verlaten."
  you-are-spectator: "{prefix}<gray>Je bent dood en kijkt nu mee als spectator."
  team-chat-prefix: "<dark_gray>[</dark_gray>{team}<dark_gray>]</dark_gray> "
  win: "{prefix}<gold><bold>{team} <gold><bold>heeft de oorlog gewonnen!"
  win-title: "{team}"
  win-subtitle: "<gold>wint de oorlog!"
  draw: "{prefix}<yellow><bold>Gelijkspel!</bold></yellow> <gray>Niemand heeft het overleefd."
  draw-title: "<yellow>Gelijkspel"
  timeout: "{prefix}<yellow>De tijd is op!"
  stopped: "{prefix}<red>De oorlog is gestopt door een admin."
  stats:
    - "<dark_gray><st>                                    </st>"
    - "<gold><bold>Jouw oorlog-stats</bold>"
    - "<gray>Kills: <yellow>{kills}"
    - "<gray>Damage: <yellow>{damage}"
  top-header: "<gold>Top kills:"
  top-line: "<gray>{rank}. <white>{player}</white> <dark_gray>-</dark_gray> <yellow>{kills}</yellow> <gray>kills"
  stats-footer: "<dark_gray><st>                                    </st>"
  damage-hearts: "{value} ❤"
  damage-hp: "{value} HP"
  rejoin-lobby: "{prefix}<gray>Je bent teruggezet naar de lobby."

kitpvp:
  welcome: "{prefix}<gray>Welkom in KitPvP! Iedereen tegen iedereen."
  killed-by: "{prefix}{victim} <gray>is gedood door <red>{killer}</red> <gray>(streak: <yellow>{streak}</yellow>)"
  died: "{prefix}{victim} <gray>is gestorven."
  streak: "{prefix}<red>{player}</red> <gold>heeft een killstreak van <yellow>{streak}</yellow>!"

stats:
  header: "{prefix}<gold>Stats van <yellow>{player}</yellow>:"
  lines:
    - "<gray>OS kills: <yellow>{os_kills}"
    - "<gray>OS wins: <yellow>{os_wins}"
    - "<gray>OS potjes: <yellow>{os_games}"
    - "<gray>OS damage: <yellow>{os_damage}"
    - "<gray>KitPvP kills: <yellow>{kitpvp_kills}"
    - "<gray>KitPvP deaths: <yellow>{kitpvp_deaths}"
    - "<gray>Beste KitPvP-streak: <yellow>{kitpvp_best_streak}"
  unknown-player: "{prefix}<red>Geen stats gevonden voor <yellow>{player}</yellow>."

leaderboard:
  titles:
    top-kills: "<gold><bold>Top Kills</bold> <gray>(Oorlog)"
    top-wins: "<gold><bold>Top Wins</bold> <gray>(Oorlog)"
    top-damage: "<gold><bold>Top Damage</bold> <gray>(Oorlog)"
    kitpvp-kills: "<red><bold>Top Kills</bold> <gray>(KitPvP)"
    kitpvp-streak: "<red><bold>Hoogste Killstreak</bold> <gray>(KitPvP)"
  line: "<yellow>#{rank}</yellow> <white>{player}</white> <dark_gray>-</dark_gray> <gold>{value}"
  empty-line: "<gray>#{rank} -"

pvp:
  cooldown: "{prefix}<red>Nog <yellow>{seconds}</yellow> seconden cooldown."
